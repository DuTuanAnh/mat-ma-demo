<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C2133">
<title>MẬT MÃ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
:root{
  --bg:#0C2133;--surface:#163044;--raised:#1C394D;--cream:#F8F3E6;--paper:#FFFDF6;
  --gold:#F6C66A;--gold-dark:#A96B1E;--teal:#4BB8A7;--teal-dark:#167A73;--ink:#173044;
  --muted:#C7D5D5;--line:#315064;--green:#35A66F;--green-s:#E5F4E8;--red:#E76F62;--red-s:#FCE9E4;
  --purple:#9A72D8;--purple-s:#F0E9FA;--shadow:0 12px 28px rgba(0,0,0,.25);--radius:20px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#295169 0,var(--bg) 54%);color:var(--cream);
  font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
.app{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.device{position:relative;width:min(100%,430px);min-height:100vh;padding:0;overflow:hidden;
  background:radial-gradient(circle at 76% 10%,#2c5366 0,#163044 34%,#0c2133 72%)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;position:sticky;top:0;z-index:4;
  background:linear-gradient(180deg,#0c2133ee,#0c213300);backdrop-filter:blur(6px)}
.brand{font:800 20px/1 "Baloo 2",sans-serif;letter-spacing:.04em;color:var(--gold)}
.brand small{display:block;font:600 9px/1.4 "Be Vietnam Pro";color:var(--muted);letter-spacing:.14em}
.globe{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;color:var(--cream)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:#163044;border:1px solid #315064;font-size:20px}
.screen{padding:12px 20px 40px;position:relative;z-index:1;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);font-weight:700}
h1{font:800 30px/1.15 "Baloo 2",sans-serif;color:var(--gold);margin:8px 0 6px}
h2{font:700 21px/1.25 "Baloo 2",sans-serif;color:var(--ink);margin:0}
.sub{color:var(--muted);line-height:1.55;margin:0 0 16px}
.paper{background:var(--cream);color:var(--ink);padding:18px;border:1px solid #e0d2b2;border-radius:20px;box-shadow:var(--shadow);margin:14px 0}
.btn{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--gold);color:var(--bg);font-weight:700;font-size:16px;box-shadow:0 8px 20px #0004;margin-top:12px;transition:.12s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--surface);color:var(--gold);border:1px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;min-height:44px;font-weight:600}
.btn:disabled{background:#596d73;color:#aab4b0;box-shadow:none;cursor:not-allowed}

/* country list */
.flags{display:grid;gap:10px;margin-top:8px}
.flagbtn{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--cream);text-align:left}
.flagbtn:hover{border-color:var(--gold)}
.flagbtn .fl{font-size:30px;line-height:1}
.flagbtn .nm{font-weight:600}.flagbtn .lg{font-size:12px;color:var(--muted)}
.flagbtn .go{margin-left:auto;color:var(--gold);font-size:20px}

/* home */
.petcard{text-align:center;background:linear-gradient(180deg,#1b3a4d,#13293a);border:1px solid var(--line);border-radius:24px;padding:22px 18px;margin-top:6px}
.pet{font-size:88px;line-height:1;filter:drop-shadow(0 8px 10px #0006);transition:.3s}
.petname{font-weight:700;font-size:16px;margin-top:4px;color:var(--cream)}
.meter{height:10px;border-radius:99px;background:#345266;overflow:hidden;margin:12px 0 4px}
.meter i{height:100%;display:block;background:linear-gradient(90deg,var(--teal-dark),var(--teal));border-radius:inherit;transition:width .5s}
.tiles{display:grid;gap:10px;margin:14px 0}
.tile{display:flex;align-items:center;gap:12px;padding:15px;background:#163044;border:1px solid #315064;border-radius:16px;color:var(--cream);text-align:left}
.tile .em{font-size:24px}.tile .tx{flex:1}.tile .tx b{display:block;font-size:15px}.tile .tx small{color:var(--muted);font-size:12px}.tile .go{color:var(--gold);font-size:20px}

/* puzzle */
.hud{display:flex;gap:8px;justify-content:center;margin:4px 0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#28464f;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--cream)}
.chip b{color:var(--gold)}
.sequence{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;margin:10px 0}
.num{font:800 20px/1 "Baloo 2",sans-serif;padding:11px 10px;background:#e7dcc2;color:#2a2012;border-radius:10px;min-width:44px;text-align:center}
.num.q{background:#fff2ca;color:#8c5a16;outline:2px dashed #d9a742}
.gridP{display:grid;gap:5px;justify-content:center;margin:12px auto}
.gcell{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font:700 13px "Be Vietnam Pro";color:#4a5f68;background:#13273500;border:1px solid #27455620}
.gcell.lit{background:linear-gradient(145deg,var(--gold),#c98f2e);color:#3a2608;box-shadow:0 0 12px #f6c66a66;border-color:transparent}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.choice{min-height:56px;border:1px solid #315064;background:#163044;color:var(--cream);border-radius:16px;font:800 18px "Baloo 2",sans-serif;transition:.14s}
.choice:hover,.choice.sel{border:2px solid var(--gold);background:#244a57;color:var(--gold)}
.choice.correct{background:var(--green-s);border:2px solid var(--green);color:#185c39}
.choice.wrong{background:var(--red-s);border:2px solid var(--red);color:#8a352d}
.fox-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#163044aa;border:1px solid #315064;margin-top:6px}
.fox-row .fx{font-size:34px}.fox-row p{font-size:13px;color:#e4e9df;margin:0}.fox-row b{color:var(--gold)}
.statusline{text-align:center;min-height:22px;font-weight:600;font-size:14px;margin:8px 0}

/* wow reveal */
.wow{text-align:center}
.wowbig{font:800 54px/1 "Baloo 2",sans-serif;background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#fff7e5;color:#2a2012;border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font:800 20px "Baloo 2",sans-serif}.stat small{color:#56656a;font-size:11px}
.reveal-tiles{margin:10px 0}.rt{display:flex;justify-content:space-between;padding:12px 14px;background:#fff;border:1px solid #e0d2b2;border-radius:12px;margin-top:8px;color:#2a2012}
.rt span{color:#56656a}.rt b{color:var(--gold-dark)}
.caption{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="app"><div class="device">
  <div class="bar" id="bar"></div>
  <div class="screen" id="screen"></div>
</div></div>

<script>
/* ========================= i18n ========================= */
const I18N={
 vi:{
  tagline:"GIẢI MÃ · CẢ NHÀ",
  lang_title:"Chọn quốc gia", lang_sub:"Choose your country / Chọn quốc gia của bạn",
  home_hi:"Chào mừng trở lại", home_play:"Chơi tiếp", home_play_sub:"Phòng giải mã · Màn %n",
  home_daily:"Thử thách hằng ngày", home_daily_sub:"Một câu đố · nhận 20 XP",
  home_collect:"Bộ sưu tập", home_collect_sub:"Huy hiệu & vật phẩm",
  petname:"Cáo Nhỏ", pet_eul:"Bạn đồng hành giải mã",
  room:"Phòng giải mã", find:"Quan sát quy luật rồi chọn đáp án",
  check:"Kiểm tra", choose:"Chọn đáp án", hint:"Gợi ý",
  lives:"Lượt", hintleft:"Gợi ý",
  fox_help:"Đọc kỹ dãy từ trái sang phải nhé!",
  wrong:"Chưa đúng. Thử nghĩ khác hướng.", wrong_fox:"Không sao! Mỗi lần thử là thêm manh mối.",
  wow_sub:"Bạn đã phá được quy luật!", explain_title:"Vì sao",
  reward:"Phần thưởng", xp:"XP", coin:"Xu", rank:"Hạng",
  next:"Câu tiếp theo", home_btn:"Về trang chủ", back:"Quay lại",
  settings:"Cài đặt", change_lang:"Đổi ngôn ngữ / quốc gia",
  note:"Bản dựng thử · giao diện theo bộ thiết kế đã duyệt",
  done_title:"Hết câu mẫu!", done_sub:"Bản thật sẽ có hàng trăm phòng + 1 câu mỗi ngày.", replay:"Chơi lại từ đầu"
 },
 en:{
  tagline:"DECODE · FAMILY",
  lang_title:"Select your country", lang_sub:"Choose your country / Chọn quốc gia của bạn",
  home_hi:"Welcome back", home_play:"Continue", home_play_sub:"Decoding room · Level %n",
  home_daily:"Daily challenge", home_daily_sub:"One puzzle · earn 20 XP",
  home_collect:"Collection", home_collect_sub:"Badges & items",
  petname:"Little Fox", pet_eul:"Your decoding companion",
  room:"Decoding room", find:"Spot the rule, then pick the answer",
  check:"Check", choose:"Pick an answer", hint:"Hint",
  lives:"Tries", hintleft:"Hints",
  fox_help:"Read the sequence carefully, left to right!",
  wrong:"Not quite. Try a different angle.", wrong_fox:"It's okay! Every try is another clue.",
  wow_sub:"You cracked the rule!", explain_title:"Why",
  reward:"Rewards", xp:"XP", coin:"Coins", rank:"Rank",
  next:"Next puzzle", home_btn:"Home", back:"Back",
  settings:"Settings", change_lang:"Change language / country",
  note:"Prototype build · UI from the approved design system",
  done_title:"End of sample puzzles!", done_sub:"The full game has hundreds of rooms + one puzzle every day.", replay:"Play again"
 }
};
const COUNTRIES=[
 {fl:"🇻🇳",nm:"Việt Nam",lg:"Tiếng Việt",lang:"vi"},
 {fl:"🇺🇸",nm:"United States",lg:"English",lang:"en"},
 {fl:"🇬🇧",nm:"United Kingdom",lg:"English",lang:"en"},
 {fl:"🇦🇺",nm:"Australia",lg:"English",lang:"en"},
 {fl:"🇸🇬",nm:"Singapore",lg:"English",lang:"en"},
 {fl:"🇨🇦",nm:"Canada",lg:"English",lang:"en"},
];

/* ========================= puzzles (localized) ========================= */
const D4=[0,3,5,8,10,13,15,16,17,18,19,23,28,33]; // số "4" trên lưới 5x7
const PUZZLES=[
 { type:'seq', neutral:true,
   items:['1','11','21','1211','?'], answer:'111221', options:['111221','1211','112211','211211'],
   vi:{prompt:"Tìm số tiếp theo trong dãy", sub:"Mỗi dòng được tạo từ dòng liền trước.",
       hint:"Đọc 1211 thành: một số 1, một số 2, hai số 1. Viết số lượng trước mỗi chữ số.",
       ex_title:"Mỗi dòng ĐỌC dòng trên", ex:"1211 = một 1, một 2, hai 1 → 111221. Số lượng luôn đứng trước chữ số."},
   en:{prompt:"Find the next number", sub:"Each line is built from the one before it.",
       hint:"Read 1211 as: one 1, one 2, two 1s. Write the count before each digit.",
       ex_title:"Each line READS the one above", ex:"1211 = one 1, one 2, two 1s → 111221. The count always comes before the digit."} },

 { type:'seq',
   vi:{items:['M','H','B','B','N','S','?','T','C'], answer:'B', options:['B','S','N','C'],
       prompt:"Chữ nào vào ô trống?", sub:"Dãy ký hiệu theo một quy luật giấu.",
       hint:"Đọc to lên: chữ cái ĐẦU của những thứ mình đếm mỗi ngày…",
       ex_title:"Chữ đầu của số đếm", ex:"M-H-B-B-N-S-B-T-C = Một Hai Ba Bốn Năm Sáu Bảy Tám Chín. Ô trống = Bảy = B."},
   en:{items:['O','T','T','F','F','S','?','E','N'], answer:'S', options:['S','N','E','T'],
       prompt:"Which letter fills the blank?", sub:"A sequence that follows a hidden rule.",
       hint:"Say them out loud: the FIRST letters of something you count every day…",
       ex_title:"First letters of counting", ex:"O-T-T-F-F-S-S-E-N = One Two Three Four Five Six Seven Eight Nine. Blank = Seven = S."} },

 { type:'grid', neutral:true, cols:5, rows:7, lit:D4, answer:'4', options:['2','4','7','9'],
   vi:{prompt:"Mã khóa là một chữ số. Là số mấy?", sub:"Mỗi ô có một ký hiệu — nhưng mã không nằm ở ký hiệu.",
       hint:"Đừng soi từng ô. Lùi màn hình ra xa, các ô SÁNG đang vẽ thành số gì?",
       ex_title:"Lùi lại nhìn tổng thể", ex:"Các ô sáng vẽ thành số 4. Bẫy: mình mải soi từng ô nên không thấy hình to."},
   en:{prompt:"The code is a single digit. Which one?", sub:"Each tile shows a symbol — but the code isn't in the symbols.",
       hint:"Don't inspect each tile. Step back — what shape do the LIT tiles form?",
       ex_title:"Step back, see the whole", ex:"The lit tiles draw the number 4. Trap: you focus on each tile and miss the big picture."} },
];
const NOISE=['3','7','5','2','8','1','4','9','6','0','7','2','5','8','1','4','9'];

/* ========================= state ========================= */
let lang='vi', screen='lang', pi=0, selected=null, lives=3, hints=3, solved=false, hintShown=false;
let xp=320, xpMax=1000, coins=15;
function t(k){return I18N[lang][k]||k;}
function pl(p){return p.neutral?p[lang]:p[lang];} // localized text block
function pdata(p){ // items/answer/options (neutral shared, else per-lang)
  if(p.type==='seq'&&!p.neutral) return {items:p[lang].items,answer:p[lang].answer,options:p[lang].options};
  return {items:p.items,answer:p.answer,options:p.options};
}

const bar=document.getElementById('bar'), view=document.getElementById('screen');

function renderBar(){
  if(screen==='lang'){ bar.innerHTML=''; return; }
  const c=COUNTRIES.find(x=>x.lang===lang)||COUNTRIES[0];
  bar.innerHTML='<div class="brand">MẬT MÃ<small>'+t('tagline')+'</small></div>'+
    '<button class="globe" onclick="go(\'lang\')">'+c.fl+' '+(lang==='vi'?'VI':'EN')+' ▾</button>';
}

function go(s){ screen=s; selected=null; hintShown=false; render(); window.scrollTo(0,0); }

function render(){
  renderBar();
  if(screen==='lang') return renderLang();
  if(screen==='home') return renderHome();
  if(screen==='puzzle') return renderPuzzle();
  if(screen==='wow') return renderWow();
  if(screen==='done') return renderDone();
}

function renderLang(){
  view.innerHTML='<div style="text-align:center;margin-top:30px"><div class="brand" style="font-size:34px">MẬT MÃ</div>'+
    '<div class="eyebrow" style="margin-top:6px">DECODE · FAMILY</div></div>'+
    '<h1 style="text-align:center;margin-top:26px">'+t('lang_title')+'</h1>'+
    '<p class="sub" style="text-align:center">'+t('lang_sub')+'</p>'+
    '<div class="flags">'+COUNTRIES.map((c,i)=>'<button class="flagbtn" onclick="pickCountry('+i+')"><span class="fl">'+c.fl+'</span><span><span class="nm">'+c.nm+'</span><br><span class="lg">'+c.lg+'</span></span><span class="go">›</span></button>').join('')+'</div>';
}
function pickCountry(i){ lang=COUNTRIES[i].lang; document.documentElement.lang=lang; go('home'); }

function renderHome(){
  const pct=Math.round(xp/xpMax*100);
  view.innerHTML='<div class="eyebrow">'+t('home_hi')+'</div>'+
    '<div class="petcard"><div class="pet">🦊</div><div class="petname">'+t('petname')+'</div>'+
      '<div class="meter"><i style="width:'+pct+'%"></i></div><div style="font-size:12px;color:var(--muted)">'+xp+' / '+xpMax+' XP</div></div>'+
    '<div class="tiles">'+
      tile('▶', t('home_play'), t('home_play_sub').replace('%n', pi+1), "go('puzzle')")+
      tile('✨', t('home_daily'), t('home_daily_sub'), "go('puzzle')")+
      tile('🧩', t('home_collect'), t('home_collect_sub'), "")+
    '</div>'+
    '<div class="fox-row"><div class="fx">🦊</div><p><b>'+t('petname')+'</b><br>'+t('pet_eul')+'</p></div>'+
    '<button class="btn" onclick="go(\'puzzle\')">'+t('home_play')+'</button>'+
    '<div class="caption">'+t('note')+'</div>';
}
function tile(em,title,sub,onclick){
  return '<button class="tile" onclick="'+onclick+'"><span class="em">'+em+'</span><span class="tx"><b>'+title+'</b><small>'+sub+'</small></span><span class="go">›</span></button>';
}

function renderPuzzle(){
  const p=PUZZLES[pi], L=pl(p), d=pdata(p);
  let puzHtml='';
  if(p.type==='seq'){
    puzHtml='<div class="sequence">'+d.items.map(it=>'<span class="num'+(it==='?'?' q':'')+'">'+it+'</span>').join('')+'</div>';
  } else {
    puzHtml='<div class="gridP" style="grid-template-columns:repeat('+p.cols+',1fr)">'+
      Array.from({length:p.cols*p.rows},(_,i)=>'<div class="gcell'+(p.lit.includes(i)?' lit':'')+'">'+NOISE[i%NOISE.length]+'</div>').join('')+'</div>';
  }
  view.innerHTML='<div class="hud"><span class="chip">'+t('room')+' · '+(pi+1)+'/'+PUZZLES.length+'</span>'+
      '<span class="chip">❤ '+t('lives')+' <b>'+lives+'</b></span><span class="chip">💡 '+hints+'</span></div>'+
    '<div class="paper"><div class="eyebrow">'+t('room')+'</div><h2>'+L.prompt+'</h2>'+puzHtml+
      '<p style="text-align:center;color:#56656a;font-size:13px;margin-top:6px">'+L.sub+'</p></div>'+
    (hintShown?'<div class="paper" style="background:#fff2ca;border-color:#e8cf8a"><div class="eyebrow" style="color:#8c5a16">'+t('hint')+'</div><p style="color:#5f471c;margin-top:4px">'+L.hint+'</p></div>':'')+
    '<div class="choices" id="choices">'+d.options.map(o=>'<button class="choice'+(selected===o?' sel':'')+'" onclick="pick(\''+o+'\')">'+o+'</button>').join('')+'</div>'+
    '<div class="statusline" id="statusline"></div>'+
    '<div class="fox-row"><div class="fx">🦊</div><p><b>'+t('petname')+'</b><br>'+t('fox_help')+'</p></div>'+
    '<button class="btn" id="checkBtn" '+(selected?'':'disabled')+' onclick="check()">'+(selected?t('check'):t('choose'))+'</button>'+
    '<button class="btn secondary" onclick="hintShown=true;render()" '+(hints<=0?'disabled':'')+'>💡 '+t('hint')+' ('+hints+')</button>'+
    '<button class="btn ghost" onclick="go(\'home\')">'+t('back')+'</button>';
}
function pick(o){ if(solved)return; selected=o; render(); }
function check(){
  const p=PUZZLES[pi], d=pdata(p);
  if(selected===d.answer){ solved=true; xp=Math.min(xpMax,xp+40); coins+=15; go('wow'); }
  else{
    lives--;
    const sl=document.getElementById('statusline');
    document.querySelectorAll('#choices .choice').forEach(b=>{if(b.textContent===selected)b.classList.add('wrong');});
    if(sl){ sl.style.color='var(--red)'; sl.textContent='✕ '+t('wrong'); }
    const fr=view.querySelector('.fox-row p'); if(fr) fr.innerHTML='<b>'+t('petname')+'</b><br>'+t('wrong_fox');
    if(lives<=0){ lives=3; } // demo: không khóa, cho thử lại
  }
}

function renderWow(){
  solved=false; const p=PUZZLES[pi], L=pl(p);
  view.innerHTML='<div class="wow"><div style="font-size:60px;margin-top:10px">✨</div>'+
    '<div class="wowbig">WOW!</div>'+
    '<h2 style="color:var(--gold)">'+t('wow_sub')+'</h2></div>'+
    '<div class="stats"><div class="stat"><b>+40</b><small>'+t('xp')+'</small></div><div class="stat"><b>+15</b><small>'+t('coin')+'</small></div><div class="stat"><b>★3</b><small>'+t('rank')+'</small></div></div>'+
    '<div class="paper"><div class="eyebrow">'+t('explain_title')+'</div><h2>'+L.ex_title+'</h2>'+
      '<p style="margin-top:8px;color:#2a2012">'+L.ex+'</p></div>'+
    '<div class="fox-row"><div class="fx">🦊</div><p><b>'+t('petname')+'</b><br>+40 XP</p></div>'+
    (pi<PUZZLES.length-1
      ? '<button class="btn" onclick="pi++;go(\'puzzle\')">'+t('next')+'</button>'
      : '<button class="btn" onclick="go(\'done\')">'+t('next')+'</button>')+
    '<button class="btn secondary" onclick="go(\'home\')">'+t('home_btn')+'</button>';
}

function renderDone(){
  view.innerHTML='<div style="text-align:center;margin-top:30px"><div style="font-size:70px">🏆</div>'+
    '<h1>'+t('done_title')+'</h1><p class="sub" style="text-align:center">'+t('done_sub')+'</p></div>'+
    '<button class="btn" onclick="pi=0;go(\'puzzle\')">'+t('replay')+'</button>'+
    '<button class="btn secondary" onclick="go(\'home\')">'+t('home_btn')+'</button>';
}

render();
</script>
</body>
</html>
